<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Shivani's Cake</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Caveat:wght@500;700&family=Nunito+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen stage, night room. The moments (status card, table, candles, cut, song, note)
   crossfade in place. Single committed theme: a dark room lit by candle and screen light. */
:root{
  --bg:#070c1e; --bg2:#172651; --fg:#f6f3ec; --muted:#a6b1d3; --dim:#6b77a0;
  --gold:#ffd27a; --flame:#ffb347;
  --blue:#5f8cf0; --blue-dk:#3657b4; --blue-lt:#bcd0ff; --cream:#fff6e3; --sponge:#f3dcae;
  --display:'Marcellus',Georgia,'Times New Roman',serif;
  --hand:'Caveat','Segoe Print','Bradley Hand',cursive;
  --body:'Nunito Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono','SF Mono',Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(120% 70% at 50% 115%,var(--bg2),var(--bg) 70%);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#app{height:100%;position:relative}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-inline:16px;padding-block:16px;text-align:center;transition:opacity .8s ease}
.scene.out{opacity:0;pointer-events:none}
.eyebrow{margin:0;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
h1.name{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(3.2rem,12vw,6.5rem);line-height:1;letter-spacing:.02em;text-wrap:balance}
.sub{margin:0;font-size:1.05rem;color:var(--muted)}
.btn{font:600 1rem var(--body);color:var(--bg);background:var(--gold);border:0;border-radius:999px;padding:14px 28px;cursor:pointer;box-shadow:0 8px 30px rgba(255,210,122,.3)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid rgba(255,255,255,.3);box-shadow:none}
.btn:focus-visible,.link:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:.9rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}

/* lock + status card */
#status{align-items:flex-start;justify-content:center}
.card{width:min(100%,520px);margin-inline:auto;text-align:left;font-family:var(--mono);font-size:clamp(1rem,3.6vw,1.25rem);line-height:1.9;color:var(--fg);min-height:11em}
.card .k{color:var(--dim)}
.card .sm{display:block;font-size:.78em;color:var(--muted);margin-top:-.4em;margin-bottom:.3em}
.card .cur::after{content:'▍';color:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.card .sig{font-family:var(--hand);font-size:1.7em;color:var(--gold);line-height:1.2;margin-top:.5em}
#status .link{align-self:center}

/* the table */
#table{justify-content:flex-start;gap:8px;padding-block:10px}
.wall{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,4vw,28px);width:min(100%,560px);margin-top:4px}
.clock{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.clock svg{width:clamp(46px,11vw,64px);height:auto}
.window{position:relative;width:clamp(150px,44vw,240px);aspect-ratio:4/3;max-width:100%;border:6px solid #1b2440;border-radius:4px;background:linear-gradient(180deg,#0e1a3d,#1a2b5e 60%,#223a7a);box-shadow:inset 0 0 40px rgba(0,0,0,.5),0 0 0 1px #2b3760}
.window::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#1b2440}
.window::after{content:'';position:absolute;top:50%;left:0;right:0;height:4px;margin-top:-2px;background:#1b2440}
.window canvas{position:absolute;inset:0;width:100%;height:100%}
.moon{position:absolute;right:14%;top:16%;width:12%;aspect-ratio:1;border-radius:50%;background:#f1e7c9;box-shadow:0 0 24px rgba(255,240,200,.6);opacity:.85}
.wallcap{margin:0;font-size:.8rem;color:var(--dim)}
.wish{display:flex;gap:8px;width:min(100%,420px);align-items:center;transition:opacity .5s,transform .5s}
.wish input{flex:1;min-width:0;font:1rem var(--body);color:var(--fg);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:12px 16px}
.wish input::placeholder{color:var(--dim)}
.wish .btn{padding:12px 18px;white-space:nowrap}
.wish.sealed{opacity:0;transform:scale(.6) translateY(-30px);pointer-events:none}
.seal{position:absolute;top:14px;right:16px;display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);opacity:0;transition:opacity .6s .5s}
.seal.on{opacity:1}
.seal svg{width:22px;height:16px}
.hint{margin:0;min-height:1.6em;font-size:1.05rem;color:var(--muted);transition:opacity .4s}
.hint.big{font-family:var(--hand);font-size:2.3rem;color:var(--gold);line-height:1}
.lyricline{margin:0;min-height:1.5em;font-family:var(--hand);font-size:1.6rem;line-height:1.2;color:var(--blue-lt);opacity:0;transition:opacity .8s}
.lyricline.on{opacity:1}
#stage{position:relative;width:min(92vw,52vh*400/440,520px);touch-action:none;cursor:default}
#cake{display:block;width:100%;height:auto;aspect-ratio:400/440;overflow:visible}
#candles{transition:transform 1s ease,opacity 1s ease}
#candles.lift{transform:translateY(-70px);opacity:0}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .9s ease-in-out infinite alternate;transition:transform .35s ease,opacity .35s}
.flame.b{animation-duration:1.15s;animation-delay:-.4s}
.flame.out{transform:scaleY(0) scaleX(.4);opacity:0}
.glow{transition:opacity .6s}
.glow.out{opacity:0}
@keyframes flick{from{transform:scaleY(1) skewX(-3deg)}to{transform:scaleY(1.12) skewX(4deg)}}
.half{transition:transform .9s cubic-bezier(.2,.8,.2,1)}
#halfL.cut{transform:translateX(-22px)}
#halfR.cut{transform:translateX(22px)}
.face{opacity:0;transition:opacity .4s}
.face.on{opacity:1}
#cutLine{fill:none;stroke:#fff;stroke-opacity:.75;stroke-width:2;stroke-dasharray:4 5;stroke-linecap:round;stroke-linejoin:round}
#knife{position:absolute;left:0;top:0;width:44px;height:198px;pointer-events:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));transform-origin:16px 178px;transform:rotate(-10deg)}
#knife.rest{transition:left .8s ease,top .8s ease,transform .8s ease}
#knife svg,#slice svg{width:100%;height:100%;display:block}
#slice{position:absolute;width:84px;height:70px;pointer-events:none;opacity:0;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5));transition:transform 2.6s cubic-bezier(.3,.6,.4,1),opacity .6s}
#slice.go{opacity:1}
#slice.away{opacity:0;transition:transform 2.6s cubic-bezier(.3,.6,.4,1),opacity 1s 1.8s}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

/* song */
#song{padding:0;gap:0;justify-content:flex-end;background:#000}
.bd{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;will-change:opacity}
.bd.on{opacity:1}
.bd .blur{position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(26px) brightness(.5) saturate(1.15)}
.bd .pic{position:absolute;left:16px;right:16px;top:calc(62px + env(safe-area-inset-top,0px));bottom:44vh;background-size:contain;background-position:center;background-repeat:no-repeat;filter:drop-shadow(0 14px 30px rgba(0,0,0,.55));transform:scale(1);will-change:transform}
.bd.on .pic{animation:kb 14s ease-out forwards}
.bd.on .pic.alt{animation-name:kb2}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.035)}}
@keyframes kb2{from{transform:scale(1.035)}to{transform:scale(1)}}
video.bdv{object-fit:cover;object-position:center;width:100%;height:100%}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 60%,rgba(0,0,0,.8))}
.lyr{position:relative;transition:opacity .8s;z-index:2;width:100%;max-width:720px;height:44vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 20px calc(40px + env(safe-area-inset-bottom,0px));box-sizing:border-box;text-align:center}
.prev{margin:0;font-size:1rem;color:var(--muted);opacity:.7;max-width:36ch;line-height:1.3}
.now{margin:0;font-family:var(--display);font-size:clamp(1.5rem,5.2vw,2.5rem);line-height:1.2;max-width:26ch;text-wrap:balance;text-shadow:0 2px 20px rgba(0,0,0,.6);transition:opacity .25s}
.now.pa{font-family:var(--hand);font-size:clamp(2rem,6.8vw,3.3rem);color:#ffe7b0}
.now.word{font-family:var(--display);font-size:clamp(3.6rem,16vw,8rem);letter-spacing:.04em;color:var(--gold)}
.now.fade{opacity:0}
.echo{margin:0;font-family:var(--hand);font-size:1.25rem;color:var(--blue-lt);opacity:0;transition:opacity .6s;min-height:1.4em}
.echo.on{opacity:.85}
.stat{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity 1s;pointer-events:none}
.stat.on{opacity:1;background:rgba(0,0,0,.5)}
.bar{position:absolute;left:0;right:0;bottom:0;height:calc(3px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.12);z-index:3}
.bar i{display:block;height:3px;width:0;background:var(--gold)}
.ctl{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:10px;align-items:center}
.ctl .link{color:var(--muted);opacity:0;transition:opacity .6s}
.ctl .link.on{opacity:1}
.title{position:absolute;left:18px;top:calc(14px + env(safe-area-inset-top,0px));z-index:3;text-align:left;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.title b{display:block;font-family:var(--display);font-weight:400;font-size:1.1rem;letter-spacing:.02em;text-transform:none;color:var(--fg)}
.playbig{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
.paused{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);pointer-events:none}

/* ending */
#end{gap:12px}
.polaroid{margin:0;background:#fbf8f1;padding:10px 10px 28px;border-radius:3px;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:rotate(-3deg);width:min(70vw,260px)}
.polaroid img{display:block;width:100%;aspect-ratio:1;max-height:34vh;object-fit:cover;object-position:center 25%;border-radius:2px}
h2.hand{margin:6px 0 0;font-family:var(--hand);font-weight:700;font-size:clamp(2.6rem,9.5vw,4.4rem);line-height:1;color:var(--gold);text-wrap:balance}
.sig{display:flex;align-items:center;gap:10px;font-family:var(--hand);font-size:1.5rem;color:var(--muted)}
.sig svg{width:40px;height:34px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
@media (prefers-reduced-motion:reduce){.flame,.bd.on{animation:none}.scene,.half,#candles,#knife.rest,#slice{transition-duration:.01s}}
@media (max-height:640px){.wall{display:none}.wallcap{display:none}}
</style>

<div id="app">
  <section class="scene" id="cover">
    <p class="eyebrow">7 October · for</p>
    <h1 class="name">Shivani</h1>
    <p class="sub">Something has been waiting for you.</p>
    <button class="btn" id="begin" type="button" style="margin-top:14px">Tap to open</button>
  </section>

  <section class="scene out" id="status" hidden>
    <div class="card" id="card"></div>
    <button class="link" id="skipStatus" type="button">continue</button>
  </section>

  <section class="scene out" id="table" hidden>
    <div class="wall">
      <div class="clock"><svg viewBox="0 0 64 64" class="clk" aria-hidden="true"></svg>Jammu</div>
      <div class="window"><div class="moon"></div><canvas id="rain"></canvas></div>
      <div class="clock"><svg viewBox="0 0 64 64" class="clk" aria-hidden="true"></svg>Mohali</div>
    </div>
    <p class="wallcap">Same time. About 220 km apart.</p>
    <form class="wish" id="wish"><input id="wishIn" type="text" maxlength="120" placeholder="Make a wish. Only you will ever see it." autocomplete="off"><button class="btn" type="submit">Seal it</button></form>
    <div class="seal" id="seal"><svg viewBox="0 0 22 16"><rect x=".5" y=".5" width="21" height="15" rx="2" fill="#fff6e3" stroke="#c9b58c"/><path d="M1 1 L11 9 L21 1" fill="none" stroke="#c9b58c"/><circle cx="11" cy="9" r="2.4" fill="#c9413f"/></svg>wish sealed</div>
    <p class="hint" id="hint">Make a wish first, then blow out the candles</p>
    <div id="stage">
      <svg id="cake" viewBox="0 0 400 440" aria-label="A blue photo cake with Shivani's name and a 2 and an 8 candle"></svg>
      <div id="knife" hidden aria-hidden="true">
        <svg viewBox="0 0 44 198">
          <defs>
            <linearGradient id="gBlade" x1="0" x2="1"><stop offset="0" stop-color="#e9edf3"/><stop offset=".5" stop-color="#b9c1cc"/><stop offset="1" stop-color="#f4f6f9"/></linearGradient>
            <linearGradient id="gHandle" x1="0" x2="1"><stop offset="0" stop-color="#3a2a22"/><stop offset=".5" stop-color="#5a3f32"/><stop offset="1" stop-color="#2a1d17"/></linearGradient>
          </defs>
          <rect x="13" y="2" width="18" height="74" rx="7" fill="url(#gHandle)"/>
          <circle cx="22" cy="22" r="2" fill="#c8ccd3"/><circle cx="22" cy="52" r="2" fill="#c8ccd3"/>
          <rect x="11" y="74" width="22" height="9" rx="2" fill="#aab2bd"/>
          <path d="M11 83 H33 L31 160 Q24 190 17 196 L11 170 Z" fill="url(#gBlade)"/>
          <path d="M14 86 L15 166" stroke="#fff" stroke-opacity=".6" stroke-width="1.2"/>
        </svg>
      </div>
      <div id="slice" aria-hidden="true"></div>
    </div>
    <p class="lyricline" id="lyricline"></p>
  </section>

  <section class="scene out" id="song" hidden>
    <div class="bd" id="bd0"><div class="blur"></div><div class="pic"></div></div><div class="bd" id="bd1"><div class="blur"></div><div class="pic"></div></div>
    <video class="bd bdv" id="bdv0" src="v21.mp4" muted playsinline loop preload="none"></video>
    <video class="bd bdv" id="bdv1" src="v18.mp4" muted playsinline loop preload="none"></video>
    <div class="shade"></div>
    <div class="title">Now playing<b>Janamdin, From My Side</b></div>
    <div class="stat" id="stat"><div class="card" id="card2"></div></div>
    <div class="lyr" id="lyr">
      <p class="prev" id="prev"></p>
      <p class="now" id="now"></p>
      <p class="echo" id="echo"></p>
    </div>
    <div class="paused" id="pausedTag" hidden>paused · tap to resume</div>
    <div class="ctl"><button class="link" id="skipSong" type="button">skip to the end</button></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="playbig" id="playbig" hidden><button class="btn" id="playBtn" type="button">Play the song</button></div>
  </section>

  <section class="scene out" id="end" hidden>
    <figure class="polaroid"><img src="p12.jpg" alt="The two of us in the car"></figure>
    <h2 class="hand">Happy Birthday Beta</h2>
    <div class="sig"><span id="sliceIcon"></span><span>one piece kept, from my side</span></div>
    <div class="row">
      <button class="btn" id="again" type="button">Play the song again</button>
      <button class="btn ghost" id="restart" type="button">Start over</button>
    </div>
  </section>
</div>
<canvas id="fx"></canvas>
<audio id="audio" src="song.mp4" preload="auto"></audio>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
const audio=$('#audio');
let phase='wish';

// ---------- scenes ----------
function show(id){
  document.querySelectorAll('.scene').forEach(s=>{
    if(s.id===id){ s.hidden=false; void s.offsetWidth; s.classList.remove('out'); }
    else if(!s.hidden){ s.classList.add('out'); setTimeout(()=>{ if(s.classList.contains('out')) s.hidden=true; },850); }
  });
}

// ---------- preload every photo and clip so nothing arrives late ----------
const PHOTOS=['p01','p02','p03','p04','p05','p06','p07','p08','p09','p10','p11','p12','p13','p14','p15','p16','p17','us'];
let preloaded=false;
function preload(){
  if(preloaded) return; preloaded=true;
  PHOTOS.forEach(p=>{ const i=new Image(); i.src=p+'.jpg'; });
  ['bdv0','bdv1'].forEach(id=>{ const v=$('#'+id); if(v.preload!=='auto'){ v.preload='auto'; v.load(); } });
}

// ---------- ambience: rain + clock (Web Audio, unlocked on the first tap) ----------
let actx=null, rainGain=null, tickTimer=0;
function unlockAudio(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    actx.resume();
    const b=actx.createBuffer(1,1,22050), s=actx.createBufferSource(); s.buffer=b; s.connect(actx.destination); s.start(0);
  }catch(e){}
  // unlock the <audio> element too, so play() works later without a tap
  if(!audio.dataset.unlocked){
    audio.muted=true;
    const p=audio.play();
    if(p&&p.then) p.then(()=>{audio.pause();audio.currentTime=0;audio.muted=false;audio.dataset.unlocked='1';}).catch(()=>{audio.muted=false;});
  }
}
function startAmbience(){
  if(!actx) return;
  if(!rainGain){
    const len=actx.sampleRate*3, buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
    let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.5; }
    const src=actx.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1400;
    const hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=300;
    rainGain=actx.createGain(); rainGain.gain.value=0;
    src.connect(hp); hp.connect(lp); lp.connect(rainGain); rainGain.connect(actx.destination); src.start();
    const lfo=actx.createOscillator(), lg=actx.createGain(); lfo.frequency.value=.11; lg.gain.value=.05; lfo.connect(lg); lg.connect(rainGain.gain); lfo.start();
  }
  rainGain.gain.cancelScheduledValues(actx.currentTime);
  rainGain.gain.linearRampToValueAtTime(.16,actx.currentTime+2.5);
  if(tickTimer) return;
  tickTimer=setInterval(()=>{
    if(!actx) return; const t=actx.currentTime;
    const o=actx.createOscillator(), g=actx.createGain(); o.type='square'; o.frequency.value=1900;
    const f=actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2200; f.Q.value=6;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+.05);
    o.connect(f); f.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+.06);
  },1000);
}
function stopAmbience(){
  if(rainGain&&actx){ rainGain.gain.cancelScheduledValues(actx.currentTime); rainGain.gain.linearRampToValueAtTime(0,actx.currentTime+1.5); }
  clearInterval(tickTimer); tickTimer=0;
}

// ---------- status card (typed) ----------
const STATUS=[
  ['Location: ','doesn\u2019t matter','Jammu \u2192 Mohali, about 220 km'],
  ['Time: ','can\u2019t measure it anyway','both clocks say the same thing'],
  ['Status: ','apart, still close, still talking',''],
  ['Case: ','adjourned, never dismissed',''],
  ['','',''],
  ['','Happy birthday. From my side.','']
];
let typing=null;
function typeCard(el,lines,done){
  el.innerHTML=''; let li=0, ci=0, cur=null, cancelled=false;
  function next(){
    if(cancelled) return;
    if(li>=lines.length){ if(done) done(); return; }
    const [k,v,sm]=lines[li];
    if(!k&&!v){ el.appendChild(document.createElement('br')); li++; setTimeout(next,350); return; }
    if(!cur){
      const d=document.createElement('div'); if(!k) d.className='sig';
      if(k){ const ks=document.createElement('span'); ks.className='k'; ks.textContent=k; d.appendChild(ks); }
      cur=document.createElement('span'); cur.className='cur'; d.appendChild(cur); el.appendChild(d);
      if(sm){ const s=document.createElement('span'); s.className='sm'; s.textContent=sm; s.style.opacity=0; s.style.transition='opacity .6s'; el.appendChild(s); d.dataset.sm='1'; cur._sm=s; }
    }
    if(ci<v.length){ cur.textContent=v.slice(0,++ci); setTimeout(next,v.length>30?26:38); }
    else { cur.classList.remove('cur'); if(cur._sm) cur._sm.style.opacity=1; cur=null; ci=0; li++; setTimeout(next,li===lines.length?300:700); }
  }
  next();

const OUTRO_T=211.8;
const MARKERS=LYR.map((e,i)=>e.m?i:-1).filter(i=>i>=0);

const LINEPOS=[]; { let sec=-1,n=0; LYR.forEach((e,i)=>{ if(e.m){ const s=MARKERS.indexOf(i); if(s!==sec){sec=s;n=0;} } else { LINEPOS[i]=e.s[0]==='('?-1:n++; } }); }
function visualFor(sec,lineIdx){
  const pl=PLAN[Math.max(0,sec)];
  if(pl.k) return pl.k; if(pl.v) return pl.v;
  const pos=lineIdx>=0?Math.max(0,LINEPOS[LINES[lineIdx]]||0):0;
  return pl.p[Math.floor(pos/pl.c)%pl.p.length]+'.jpg';

let curVis='', altFlip=false;
function setBackdrop(src){
  if(src===curVis) return; curVis=src;
  const a=$('#bd'+bdFlip), b=$('#bd'+(bdFlip^1));
  const vids=['bdv0','bdv1'];
  if(src==='black'){ a.classList.remove('on'); b.classList.remove('on'); }

  else { const pic=b.querySelector('.pic'); b.querySelectorAll('.blur,.pic').forEach(x=>x.style.backgroundImage=`url(${src})`); b.classList.remove('on'); pic.classList.remove('alt'); void b.offsetWidth; altFlip=!altFlip; if(altFlip) pic.classList.add('alt'); b.classList.add('on'); a.classList.remove('on'); bdFlip^=1; }

function setMode(status){
  stat.classList.toggle('on',status); $('#lyr').style.opacity=status?0:1;

function songLoop(){
  const t=audio.currentTime;
  let sec=-1; for(let i=0;i<MARKERS.length;i++){ if(LYR[MARKERS[i]].t<=t) sec=i; else break; }
  const mode=sec===9?'word':(sec===19?'status':'line');
  let li=-1; for(let i=0;i<LINES.length;i++){ const e=LYR[LINES[i]]; if(e.t<=t&&e.s[0]!=='(') li=i; if(e.t>t) break; }
  if(sec!==curSec){ curSec=sec; setMode(mode==='status'); }
  { const pl=PLAN[Math.max(0,sec)]; const vis=pl.k==='status'?(pl.v||'black'):visualFor(sec,li); setBackdrop(vis); }

  let ec=''; for(let i=LINES.length-1;i>=0;i--){ const e=LYR[LINES[i]]; if(e.t<=t&&e.s[0]==='('){ if(t-e.t<5) ec=e.s; break; } }

  if(mode==='word'&&li>=0){
    const e=LYR[LINES[li]], nx=LINES[li+1]?LYR[LINES[li+1]].t:e.t+1.4, words=e.s.split(/\.\s*/).filter(Boolean);
    const w=words[Math.min(words.length-1,Math.floor((t-e.t)/((nx-e.t)/words.length)))];

  } else if(mode==='status'){
    // stack the outro lines, typed
    let n=0; for(let i=0;i<LINES.length;i++){ const e=LYR[LINES[i]]; if(e.t>=OUTRO_T&&e.t<=t&&e.s[0]!=='(') n++; }

      const e=LYR[LINES.filter(i=>LYR[i].t>=OUTRO_T&&LYR[i].s[0]!=='(')[statLines]];

      else { d.textContent=e.s; if(/^(Happy birthday|From my side)$/.test(e.s)) d.className='sig'; }
      card2.appendChild(d); statLines++;

    curLine=li;

      let pv=''; for(let i=li-1;i>=0;i--){ const q=LYR[LINES[i]]; if(q.s[0]!=='('){ pv=q.s; break; } }
      prevEl.textContent=li>0?pv:'';
    } else { nowEl.textContent=''; prevEl.textContent=''; }

  $('#skipSong').classList.toggle('on',t>30);
  songRaf=requestAnimationFrame(songLoop);
}
function startSong(){
  stopAmbience(); show('song'); songStarted=true;
  curSec=-1; curLine=-1; statLines=0; nowEl.textContent=''; prevEl.textContent=''; echoEl.textContent=''; curVis=''; setMode(false); preload();

}
